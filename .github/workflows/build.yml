name: Build Npp-Highlighter (cloud, no local install needed)

on:
  workflow_dispatch:      # manueller "Run workflow"-Button in der Actions-Oberfläche
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022   # GitHub-Runner mit vorinstalliertem VS 2022 Build Tools + Windows SDK + ATL
    strategy:
      matrix:
        platform: [x64, Win32]

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: ATL-Komponente nachinstallieren (fehlt auf dem Runner standardmäßig)
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          Write-Host "Gefundene VS-Installation: $vsPath"

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --wait
          Write-Host "vs_installer Exit-Code: $LASTEXITCODE"

          if ($LASTEXITCODE -ne 0) {
            throw "ATL-Installation fehlgeschlagen (Exit-Code $LASTEXITCODE)"
          }

          # Gegenprobe: ist die Header-Datei jetzt tatsächlich da?
          $atlHeader = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "atlstr.h" -Recurse -ErrorAction SilentlyContinue
          if (-not $atlHeader) {
            throw "atlstr.h wurde auch nach der Installation nicht gefunden!"
          }
          Write-Host "atlstr.h gefunden unter: $($atlHeader.FullName)"

      - name: MSBuild bereitstellen
        uses: microsoft/setup-msbuild@v2

      - name: Projekt bauen (Release)
        run: msbuild jN.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143

      - name: Fertige DLL als Download-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Npp-Highlighter-${{ matrix.platform }}
          path: Release/${{ matrix.platform }}/Npp-Highlighter.dll
          if-no-files-found: error
